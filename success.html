<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comic exported — ComicCraft</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">C!</span> ComicCraft</a></header>
  <main class="success-card">
    <div class="success-mark">✓</div>
    <p class="eyebrow">EXPORT COMPLETE</p>
    <h1>Your comic is ready.</h1>
    <p><strong>{{ comic_title }}</strong> has been prepared as a PDF. Your download should be in progress.</p>
    <a class="primary-button link-button" href="/">Create another comic <span>↗</span></a>
  </main>
</body>
</html>
